plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tengwear.nfc'
    compileSdk 34

    defaultConfig {
        applicationId "com.tengwear.nfc"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// 零第三方依赖：全部使用 Android SDK 自带 API
dependencies {
}
