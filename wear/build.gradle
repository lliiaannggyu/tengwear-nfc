plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tengwear.nfc'
    compileSdk 34

    defaultConfig {
        applicationId "com.tengwear.nfc"
        minSdk 30          // Wear OS 3+（Galaxy Watch4 及以后）
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
